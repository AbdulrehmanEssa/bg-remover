<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Background Remover - 100% Free</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7fe; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        h1 { color: #333; font-size: 24px; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        .upload-btn { background: #4f46e5; color: white; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; display: inline-block; transition: 0.3s; }
        .upload-btn:hover { background: #4338ca; }
        input[type="file"] { display: none; }
        #status { margin-top: 20px; font-weight: 500; color: #4f46e5; }
        .result-box { margin-top: 20px; display: none; }
        img { max-width: 100%; border-radius: 8px; margin-top: 15px; border: 2px dashed #ddd; }
        .download-btn { background: #10b981; color: white; padding: 10px 20px; text-decoration: none; border-radius: 6px; font-weight: 600; display: inline-block; margin-top: 15px; }
    </style>
    <!-- Free AI Background Removal Library -->
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.js"></script>
</head>
<body>

<div class="card">
    <h1>AI Background Remover</h1>
    <p>Upload image to remove background automatically for free.</p>
    
    <label class="upload-btn">
        Choose Image
        <input type="file" id="imageInput" accept="image/*">
    </label>

    <div id="status"></div>

    <div class="result-box" id="resultBox">
        <h3>Result:</h3>
        <img id="outputImage" alt="Result">
        <br>
        <a id="downloadBtn" class="download-btn" download="removed-bg.png">Download Image</a>
    </div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    const outputImage = document.getElementById('outputImage');
    const downloadBtn = document.getElementById('downloadBtn');

    imageInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        status.innerText = "Processing image... Please wait (first time takes a few seconds).";
        resultBox.style.display = 'none';

        try {
            // Background Removal Function
            const blob = await imglyRemoveBackground(file);
            const url = URL.createObjectURL(blob);
            
            outputImage.src = url;
            downloadBtn.href = url;
            
            status.innerText = "Done!";
            resultBox.style.display = 'block';
        } catch (error) {
            console.error(error);
            status.innerText = "Error removing background. Please try another image.";
        }
    });
</script>

</body>
</html>
