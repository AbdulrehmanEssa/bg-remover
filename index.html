<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Super-Fast AI Background Remover</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 480px; text-align: center; }
        h1 { color: #1a1a1a; font-size: 24px; margin-bottom: 8px; }
        p { color: #666; font-size: 14px; margin-bottom: 24px; }
        .upload-btn { background: #2563eb; color: white; padding: 14px 28px; border-radius: 8px; cursor: pointer; font-weight: 600; display: inline-block; transition: 0.2s; }
        .upload-btn:hover { background: #1d4ed8; }
        input[type="file"] { display: none; }
        #status { margin-top: 20px; font-weight: 600; color: #2563eb; min-height: 24px; word-break: break-word; }
        .result-box { margin-top: 20px; display: none; }
        img { max-width: 100%; height: auto; border-radius: 8px; margin-top: 15px; border: 2px dashed #cbd5e1; }
        .download-btn { background: #16a34a; color: white; padding: 12px 24px; text-decoration: none; border-radius: 8px; font-weight: 600; display: inline-block; margin-top: 15px; }
        .download-btn:hover { background: #15803d; }
    </style>
    <!-- Optimized AI Library for Browsers -->
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.js"></script>
</head>
<body>

<div class="card">
    <h1>⚡ AI Background Remover</h1>
    <p>Unlimited Free & Fast Auto Background Removal</p>
    
    <label class="upload-btn">
        📁 Select Image
        <input type="file" id="imageInput" accept="image/*">
    </label>

    <div id="status"></div>

    <div class="result-box" id="resultBox">
        <h3>Result:</h3>
        <img id="outputImage" alt="Result">
        <br>
        <a id="downloadBtn" class="download-btn" download="removed-bg.png">⬇ Download PNG</a>
    </div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    const outputImage = document.getElementById('outputImage');
    const downloadBtn = document.getElementById('downloadBtn');

    imageInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        status.style.color = "#2563eb";
        status.innerHTML = "⏳ Initializing AI Engine... Please wait.";
        resultBox.style.display = 'none';

        try {
            // Configuration optimized for quick CDN access
            const config = {
                progress: (key, current, total) => {
                    if (total > 0) {
                        const percent = Math.round((current / total) * 100);
                        status.innerHTML = `⏳ AI Processing: ${percent}%`;
                    }
                }
            };

            // Call the library function
            const blob = await imglyRemoveBackground(file, config);
            const url = URL.createObjectURL(blob);
            
            // Set output image src and download link
            outputImage.src = url;
            downloadBtn.href = url;
            
            // Show result
            status.style.color = "#16a34a";
            status.innerHTML = "✅ Background Successfully Removed!";
            resultBox.style.display = 'block';
        } catch (error) {
            console.error("Full Error details:", error);
            status.style.color = "#dc2626";
            status.innerHTML = "❌ Error: Browser can't start AI. Use a modern browser or try a smaller image.";
        }
    });
</script>

</body>
</html>
